<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 JMEDI CATALOG - (주)제이메디</title>
    <style>
        /* --- 기본 리셋 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #ffffff;
        }

        /* --- 전체 컨테이너 --- */
        .site-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 480px; /* 모바일 카탈로그 형태 레이아웃 */
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            background-color: #EFEFEF; /* 기본 회색 배경 */
        }

        /* --- 1. 헤더 영역 --- */
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #EFEFEF;
            font-size: 0.9rem;
            font-weight: bold;
            color: #444;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .jm-icon {
            background: linear-gradient(135deg, #e53935, #1e88e5);
            color: white;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .co-name {
            color: #333;
            font-weight: bold;
        }

        /* --- 2. 제목 영역 --- */
        .title-section {
            width: 100%;
            padding: 10px 20px 25px 20px;
            background-color: #EFEFEF;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .box-jmedi {
            color: #005691;
            background-color: #BBE2F8;
            font-size: 1.8rem;
            font-weight: 900;
            padding: 6px 14px;
            letter-spacing: -0.5px;
        }

        .box-catalog {
            color: white;
            background-color: #005691;
            font-size: 2rem;
            font-weight: 900;
            padding: 8px 18px;
            margin-left: 25px;
            letter-spacing: -0.5px;
        }

        /* --- 3. 메인 배너 영역 --- */
        .banner-section {
            width: 100%;
            background-color: #005691;
            color: white;
            padding: 35px 20px;
            min-height: 140px;
            display: flex;
            align-items: flex-start;
        }

        .banner-section p {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: -0.3px;
        }

        /* --- 4. 하단 및 물결 영역 --- */
        .footer-section {
            flex-grow: 1;
            background-color: #EFEFEF;
            position: relative;
            min-height: 300px;
            overflow: hidden;
        }

        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
        }

        /* SVG 물결 그래픽 스타일 */
        .wave-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="site-container">
        <header>
            <div class="header-left">
                2026 JMEDI CATALOG
            </div>
            <div class="header-right">
                <div class="logo-group">
                    <span class="jm-icon">JM</span>
                    <span class="co-name">(주) 제이메디</span>
                </div>
            </div>
        </header>

        <div class="title-section">
            <div class="box-jmedi">제이메디</div>
            <div class="box-catalog">카탈로그</div>
        </div>

        <div class="banner-section">
            <p>2026 제이메디 카탈로그 입니다.</p>
        </div>

        <div class="footer-section">
            <div class="wave-container">
                <svg class="wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
                    <path d="M0,60 C150,120 350,10 500,70 L500,150 L0,150 Z" fill="#90C8F6" opacity="0.7"></path>
                    <path d="M0,90 C180,40 320,120 500,60 L500,150 L0,150 Z" fill="#70B5F5"></path>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
