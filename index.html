<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이메디 모바일 책자 - 4번 친근한 일러스트 배너</title>
    <!-- 웹폰트 불러오기 (Jua, Gothic A1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #d8eaff 0%, #cbe3fd 40%, #badafb 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 0;
            font-family: 'Jua', 'Gothic A1', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ----------------------------------------------------
           [4번 친근한 일러스트 배너 컷]
        ---------------------------------------------------- */
        .top-banner-illust {
            width: 100%;
            height: 170px;
            background: linear-gradient(135deg, #3aa5f8 0%, #6bc1ff 60%, #9dd7ff 100%);
            border-radius: 22px;
            padding: 22px 20px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(58, 165, 248, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* 배경 구름 패턴 효과 */
        .cloud-pattern {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 45px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform: scaleX(1.3);
            pointer-events: none;
        }

        /* 텍스트 영역 */
        .banner-illust-text {
            position: relative;
            z-index: 2;
            max-width: 65%;
        }

        .banner-chip {
            display: inline-block;
            background: #ffffff;
            color: #1780d8;
            font-size: 0.72rem;
            font-family: 'Jua', sans-serif;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
        }

        .banner-title {
            color: #ffffff;
            font-size: 1.35rem;
            line-height: 1.25;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0, 50, 110, 0.18);
            word-break: keep-all;
        }

        .banner-sub {
            color: #f0f8ff;
            font-size: 0.8rem;
            font-family: 'Jua', sans-serif;
            letter-spacing: -0.2px;
            opacity: 0.95;
        }

        /* 우측 일러스트 아트웍 요소 */
        .illust-artwork {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 110px;
            height: 110px;
            z-index: 2;
        }

        /* 약 상자 일러스트 캐릭터 */
        .illust-box {
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 50px;
            height: 60px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(11, 75, 147, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-8deg);
            border: 2px solid #e1f0ff;
        }

        .illust-box-line {
            width: 28px;
            height: 4px;
            background: #2aa3fb;
            border-radius: 2px;
            margin-bottom: 4px;
        }

        .illust-box-cross {
            width: 16px;
            height: 16px;
            background: #ff5252;
            clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
        }

        /* 귀여운 알약 일러스트 */
        .illust-pill {
            position: absolute;
            top: 8px;
            right: 48px;
            width: 42px;
            height: 20px;
            background: linear-gradient(90deg, #ff7675 50%, #ffffff 50%);
            border-radius: 10px;
            transform: rotate(25deg);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 퐁퐁 떠있는 하트 엠블럼 */
        .illust-heart {
            position: absolute;
            top: 10px;
            right: 8px;
            font-size: 1.2rem;
            animation: float 2s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(12deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 4번 친근한 일러스트 배너 -->
        <div class="top-banner-illust">
            <div class="cloud-pattern"></div>
            
            <div class="banner-illust-text">
                <span class="banner-chip">유쾌한 건강 상식 💊</span>
                <h2 class="banner-title">제이메디가 선사하는 즐거운 일상!</h2>
                <p class="banner-sub">모바일 책자로 편리하게 만나보세요</p>
            </div>

            <!-- 우측 친근한 일러스트 요소 -->
            <div class="illust-artwork">
                <div class="illust-pill"></div>
                <div class="illust-box">
                    <div class="illust-box-line"></div>
                    <div class="illust-box-cross"></div>
                </div>
                <div class="illust-heart">❤️</div>
            </div>
        </div>
    </div>

</body>
</html>
