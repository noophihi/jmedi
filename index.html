<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이메디 모바일 책자</title>
    <!-- 구글 폰트 적용 (Pretendard / Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #bfe0f8; /* 배경 전체 연한 하늘색 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* 전체 컨테이너 */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. 상단 원형 로고 */
        .logo-circle {
            width: 80px;
            height: 80px;
            background-color: #72b2e4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .logo-text-jm {
            font-weight: 900;
            font-size: 1.8rem;
            font-style: italic;
            letter-spacing: -1px;
        }

        .logo-text-jm .j { color: #e52521; }
        .logo-text-jm .m { color: #0f5298; }

        /* 2. 상단 헤더 문구 */
        .header-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #0b3d75;
            margin-bottom: 4px;
            text-align: center;
        }

        .header-sub {
            font-size: 0.8rem;
            font-weight: 700;
            color: #588ebc;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 3. 흰색 라운드 섹션 카드 공통 */
        .card-section {
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            position: relative;
        }

        /* 뱃지 라인 타이틀 헤더 */
        .badge-header {
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .badge-header::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background-color: #aadaf8;
            z-index: 1;
        }

        .badge-title {
            position: relative;
            z-index: 2;
            background-color: #31a4fb;
            color: #ffffff;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 4px 16px;
            border-radius: 20px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 6px rgba(49, 164, 251, 0.3);
        }

        /* 4. 카탈로그 책자 리스트 (2열 배치) */
        .catalog-grid {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }

        .catalog-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        /* 책자 이미지 프레임 및 알약 그래픽 */
        .book-cover {
            width: 100%;
            aspect-ratio: 1 / 1.35;
            background: linear-gradient(180deg, #d3eaf7 0%, #edf6fc 100%);
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid #d0e4f2;
        }

        /* 책자 내부 텍스트 연출 */
        .cover-header {
            font-size: 0.55rem;
            font-weight: 900;
            color: #0b5293;
            line-height: 1.1;
        }

        .cover-title {
            font-size: 0.75rem;
            font-weight: 900;
            color: #111;
            margin-top: 2px;
        }

        /* 책자 내부 알약 박스 그래픽 구현 */
        .cover-visual {
            position: relative;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blister {
            width: 50%;
            height: 70%;
            background: rgba(255,255,255,0.8);
            border-radius: 6px;
            border: 1px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 2px;
            transform: rotate(-6deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .mini-pill {
            width: 18px;
            height: 8px;
            border-radius: 4px;
        }
        .p-red { background: #e53935; }
        .p-yellow { background: #fbc02d; }
        .p-blue { background: #1e88e5; }

        .cover-box {
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 75%;
            background: #fff;
            border: 1px solid #ddd;
            padding: 4px;
            transform: rotate(-10deg);
            box-shadow: -2px 4px 8px rgba(0,0,0,0.15);
        }

        .box-line {
            height: 2px;
            background: linear-gradient(90deg, red, yellow, blue);
            margin-bottom: 2px;
        }

        .box-txt {
            font-size: 0.55rem;
            font-weight: 900;
            color: #111;
        }

        /* 책자 하단 제목 */
        .book-title {
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 900;
            color: #0b3d75;
            text-align: center;
        }

        .catalog-footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #888888;
            font-weight: 700;
            margin-top: 5px;
        }

        /* 5. 홈페이지 안내 링크 영역 */
        .homepage-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
        }

        .hp-text-group .hp-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: #4a4a4a;
            margin-bottom: 2px;
        }

        .hp-text-group .hp-sub {
            font-size: 0.7rem;
            font-weight: 700;
            color: #aaaaaa;
            letter-spacing: 0.5px;
        }

        .click-btn-group {
            display: flex;
            gap: 4px;
        }

        .btn-box {
            background-color: #31a4fb;
            color: white;
            font-weight: 900;
            font-size: 1rem;
            padding: 8px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(49, 164, 251, 0.3);
        }

        .btn-box.dark {
            background-color: #90c8f6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 상단 아이콘 로고 -->
        <div class="logo-circle">
            <div class="logo-text-jm">
                <span class="j">J</span><span class="m">M</span>
            </div>
        </div>

        <!-- 2. 헤더 메인 타이틀 -->
        <h1 class="header-title">모바일 책자 바로가기</h1>
        <p class="header-sub">[모바일 책자를 보시려면 아래의 사진을 클릭해주세요!]</p>

        <!-- 3. 책자 리스트 영역 (2026 CATALOG) -->
        <div class="card-section">
            <div class="badge-header">
                <span class="badge-title">2026 CATALOG</span>
            </div>

            <div class="catalog-grid">
                <!-- 왼쪽 책자 -->
                <a href="#" class="catalog-item">
                    <div class="book-cover">
                        <div>
                            <div class="cover-header">JMEDI</div>
                            <div class="cover-title">2026 CATALOG</div>
                        </div>
                        <div class="cover-visual">
                            <div class="blister">
                                <div class="mini-pill p-red"></div>
                                <div class="mini-pill p-yellow"></div>
                                <div class="mini-pill p-blue"></div>
                            </div>
                            <div class="cover-box">
                                <div class="box-line"></div>
                                <div class="box-txt">JMEDI</div>
                            </div>
                        </div>
                    </div>
                    <div class="book-title">2026 제이메디 책자</div>
                </a>

                <!-- 오른쪽 책자 -->
                <a href="#" class="catalog-item">
                    <div class="book-cover">
                        <div>
                            <div class="cover-header">JMEDI</div>
                            <div class="cover-title">2026 CATALOG</div>
                        </div>
                        <div class="cover-visual">
                            <div class="blister">
                                <div class="mini-pill p-red"></div>
                                <div class="mini-pill p-yellow"></div>
                                <div class="mini-pill p-blue"></div>
                            </div>
                            <div class="cover-box">
                                <div class="box-line"></div>
                                <div class="box-txt">JMEDI</div>
                            </div>
                        </div>
                    </div>
                    <div class="book-title">역매품 책자</div>
                </a>
            </div>

            <p class="catalog-footer-note">[2026 제이메디 모바일 책자입니다!]</p>
        </div>

        <!-- 4. 홈페이지 링크 영역 (HOMEPAGE) -->
        <div class="card-section">
            <div class="badge-header">
                <span class="badge-title">HOMEPAGE</span>
            </div>

            <div class="homepage-content">
                <div class="hp-text-group">
                    <div class="hp-title">제이메디 웹사이트</div>
                    <div class="hp-sub">JMEDI WEBSITE</div>
                </div>
                <div class="click-btn-group">
                    <div class="btn-box">클</div>
                    <div class="btn-box dark">릭</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
