<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이메디 모바일 책자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        /* 원래 전체 배경 (블루 톤 자연스러운 그라데이션) */
        body {
            background: linear-gradient(180deg, #cbe3fc 0%, #badafb 50%, #9bc2f2 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 25px 0 40px 0;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. 원래 로고 및 헤더 */
        .logo-circle {
            width: 80px;
            height: 80px;
            background-color: #5ba3f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(11, 75, 138, 0.15);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title {
            font-size: 1.55rem;
            color: #0b4b8a;
            margin-bottom: 4px;
            text-align: center;
        }

        .header-sub {
            font-size: 0.85rem;
            color: #4a7ca5;
            margin-bottom: 24px;
            text-align: center;
        }

        /* 2. 원래 하얀색 섹션 카드 (자연스러운 톤 변화 및 고리 탭) */
        .card-section {
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 24px 16px 18px 16px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        /* 상단 고리 탭 (예시 이미지 연결 방식 반영) */
        .card-section::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 8px;
            border-radius: 8px 8px 0 0;
        }

        .section-catalog::before { background-color: #38a8fd; }
        .section-homepage::before { background-color: #1780d8; }

        /* 뱃지 헤더 */
        .badge-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .badge-header::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background-color: #cfe6fb;
            z-index: 1;
        }

        .badge-title {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 1.2rem;
            padding: 4px 20px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .section-catalog .badge-title { background-color: #38a8fd; }
        .section-homepage .badge-title { background-color: #1780d8; }

        /* 3. 원래 책자 리스트 (2열 배치) */
        .catalog-grid {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .catalog-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .book-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .book-title {
            margin-top: 10px;
            font-size: 1.05rem;
            color: #0b417a;
            text-align: center;
        }

        .catalog-footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: #88a3be;
            margin-top: 6px;
        }

        /* 4. 원래 홈페이지 버튼 영역 */
        .homepage-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .hp-text-group .hp-title {
            font-size: 1.15rem;
            color: #333333;
            margin-bottom: 2px;
        }

        .hp-text-group .hp-sub {
            font-size: 0.78rem;
            color: #a0a0a0;
        }

        .click-btn-group {
            display: flex;
            gap: 4px;
        }

        .btn-box {
            background-color: #38a8fd;
            color: white;
            font-size: 1.1rem;
            padding: 5px 11px;
            border-radius: 8px;
        }

        .btn-box.dark {
            background-color: #1780d8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">
            <img src="logo.png" alt="제이메디 로고" class="logo-img">
        </div>

        <h1 class="header-title">모바일 책자 바로가기</h1>
        <p class="header-sub">[모바일 책자를 보시려면 아래의 사진을 클릭해주세요!]</p>

        <div class="card-section section-catalog">
            <div class="badge-header">
                <span class="badge-title">2026 CATALOG</span>
            </div>

            <div class="catalog-grid">
                <a href="#" class="catalog-item">
                    <img src="book1.png" alt="2026 제이메디 책자" class="book-img">
                    <div class="book-title">2026 제이메디 책자</div>
                </a>

                <a href="#" class="catalog-item">
                    <img src="book2.png" alt="역매품 책자" class="book-img">
                    <div class="book-title">역매품 책자</div>
                </a>
            </div>

            <p class="catalog-footer-note">[2026 제이메디 모바일 책자입니다!]</p>
        </div>

        <div class="card-section section-homepage">
            <div class="badge-header">
                <span class="badge-title">HOMEPAGE</span>
            </div>

            <a href="https://jmedi.kr" target="_blank" style="text-decoration: none;">
                <div class="homepage-content">
                    <div class="hp-text-group">
                        <div class="hp-title">제이메디 웹사이트</div>
                        <div class="hp-sub">JMEDI WEBSITE</div>
                    </div>
                    <div class="click-btn-group">
                        <div class="btn-box">클</div>
                        <div class="btn-box dark">릭</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
