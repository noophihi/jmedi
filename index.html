<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 JMEDI CATALOG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px; /* 모바일 세로형 비율 */
            min-height: 100vh;
            background-color: #e3e3e3;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 상단 헤더 */
        header {
            padding: 24px 20px 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #4a4a4a;
            letter-spacing: -0.5px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-jm {
            font-size: 1.3rem;
            font-weight: 900;
            font-style: italic;
            color: #0b589a;
            letter-spacing: -1px;
        }

        .logo-jm span {
            color: #d9251d;
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a4a4a;
        }

        /* 메인 타이트 박스 영역 */
        .title-section {
            padding: 10px 20px 30px 20px;
        }

        .title-box-1 {
            display: inline-block;
            background-color: #a4e3ff;
            color: #0168a3;
            font-size: 2.2rem;
            font-weight: 900;
            padding: 4px 12px;
            letter-spacing: -1px;
        }

        .title-box-2 {
            display: inline-block;
            background-color: #0168a3;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            padding: 4px 12px;
            margin-top: -5px;
            margin-left: 55px;
            letter-spacing: -1px;
        }

        /* 중간 파란색 배너 */
        .banner-section {
            background-color: #0168a3;
            color: #ffffff;
            padding: 35px 20px;
            min-height: 130px;
        }

        .banner-section p {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* 하단 공간 & 물결 그래픽 */
        .footer-section {
            flex: 1;
            min-height: 250px;
            position: relative;
            background-color: #e3e3e3;
        }

        .wave-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">2026 JMEDI CATALOG</div>
            <div class="logo-area">
                <div class="logo-jm">J<span>M</span></div>
                <div class="logo-text">(주) 제이메디</div>
            </div>
        </header>

        <div class="title-section">
            <div class="title-box-1">제이메디</div><br>
            <div class="title-box-2">카탈로그</div>
        </div>

        <div class="banner-section">
            <p>2026 제이메디 카탈로그 입니다.</p>
        </div>

        <div class="footer-section">
            <svg class="wave-svg" viewBox="0 0 500 250" preserveAspectRatio="none">
                <path d="M0,130 C150,90 350,160 500,100 L500,250 L0,250 Z" fill="#b1d7fb"></path>
                <path d="M0,160 C120,110 320,180 500,120 L500,250 L0,250 Z" fill="#75abf0"></path>
            </svg>
        </div>
    </div>

</body>
</html>
