<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이메디 모바일 책자 - 2번 실사 메디컬 배너</title>
    <!-- 웹폰트 불러오기 (Jua, Gothic A1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #d8eaff 0%, #cbe3fd 40%, #badafb 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 0;
            font-family: 'Jua', 'Gothic A1', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ----------------------------------------------------
           [2번 실사 라이프스타일/메디컬 배너 컷]
        ---------------------------------------------------- */
        .top-banner-lifestyle {
            width: 100%;
            height: 170px;
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(11, 75, 147, 0.22);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 22px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 실사 배경 이미지 & 필터 오버레이 */
        .banner-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?q=80&w=800&auto=format&fit=crop') center/cover no-repeat;
            filter: blur(1.5px) brightness(0.9);
            transform: scale(1.05); /* 블러 가장자리 방지 */
            z-index: 1;
        }

        /* 블루 톤 듀오톤 필터 */
        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, rgba(11, 75, 147, 0.82) 0%, rgba(42, 163, 251, 0.65) 60%, rgba(255, 255, 255, 0.25) 100%);
            z-index: 2;
        }

        /* 텍스트 영역 */
        .banner-content {
            position: relative;
            z-index: 3;
            max-width: 80%;
        }

        .banner-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 0.7rem;
            font-family: 'Gothic A1', sans-serif;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .banner-title {
            color: #ffffff;
            font-size: 1.35rem;
            line-height: 1.25;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 20, 50, 0.35);
            word-break: keep-all;
        }

        .banner-desc {
            color: #e3f2ff;
            font-size: 0.78rem;
            font-family: 'Gothic A1', sans-serif;
            font-weight: 500;
            letter-spacing: -0.2px;
            opacity: 0.95;
        }

        .trust-badge {
            position: absolute;
            right: 18px;
            bottom: 16px;
            z-index: 3;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .trust-badge svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 2번 실사 라이프스타일/메디컬 배너 -->
        <div class="top-banner-lifestyle">
            <div class="banner-bg-img"></div>
            <div class="banner-overlay"></div>
            
            <div class="banner-content">
                <span class="banner-tag">TRUSTED PARTNER</span>
                <h2 class="banner-title">믿을 수 있는 건강 파트너, 제이메디</h2>
                <p class="banner-desc">엄선된 건강기능식품 전문 모바일 카탈로그</p>
            </div>

            <!-- 우측 신뢰 메디컬 아이콘 -->
            <div class="trust-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
